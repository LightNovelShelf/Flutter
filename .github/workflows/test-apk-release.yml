name: Build and release test APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        required: true
        default: feat/library-series-multi-select
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out requested branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Download dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build ARM64 release APK
        run: >
          flutter build apk
          --release
          --target-platform android-arm64
          --split-per-abi

      - name: Publish test pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-${{ github.run_number }}"
          gh release create "$TAG" \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ inputs.ref }}" \
            --title "LightNovelShelf Test Build #${{ github.run_number }}" \
            --notes "Automated ARM64 test build from ${{ inputs.ref }}." \
            --prerelease \
            --latest=false
