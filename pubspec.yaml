name: lightnovel
description: 轻书架官方 Flutter 客户端。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态与路由
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # 网络
  web_socket_channel: ^3.0.1
  http: ^1.2.2

  # 存储
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # 图片
  cached_network_image: ^3.4.1
  # 直接用它配置纯 Dart 的缓存元数据仓库，避开 sqflite platform channel
  flutter_cache_manager: ^3.4.1
  flutter_blurhash: ^0.8.2
  photo_view: ^0.15.0
  palette_generator: ^0.3.3+7

  # 渲染
  flutter_widget_from_html_core: ^0.15.2
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.2

  # 其它
  crypto: ^3.0.6
  intl: ^0.20.2
  collection: ^1.19.0
  dynamic_color: ^1.7.0
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/js/novel_reader.js
