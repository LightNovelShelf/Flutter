name: lightnovel
description: 轻书架官方 Flutter 客户端。
publish_to: 'none'
version: 1.7.0+12

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态与路由
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0

  # 网络
  web_socket_channel: ^3.0.1
  http: ^1.2.2

  # 存储
  # 10.x 已带 Package.swift（支持 SPM），且插件 compileSdk 仍是 36；
  # 11.x 把 compileSdk 抬到 37，会连带要求 app 编译到尚未被 AGP 9.1 推荐的 API 37。
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # 图片
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.3
  # 直接用它配置纯 Dart 的缓存元数据仓库，避开 sqflite platform channel
  flutter_cache_manager: ^3.4.1
  photo_view: ^0.15.0
  # 预览里的「保存到相册」。原生侧自己处理权限，不必再引 permission_handler。
  gal: ^2.3.3
  # 封面取色。palette_generator 已被官方 discontinued，直接用 Flutter 自己
  # 依赖的这套 Material 3 量化/打分算法；版本必须与 flutter SDK 的 pin 一致。
  material_color_utilities: 0.13.0

  # 渲染
  flutter_widget_from_html_core: ^0.17.2
  html: ^0.15.6

  # 其它
  crypto: ^3.0.6
  intl: ^0.20.2
  dynamic_color: ^1.7.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.1
  share_plus: ^13.3.0
  ffi: ^2.1.4
  code_assets: ^2.0.0
  hooks: ^2.0.2
  # GlobalCupertinoLocalizations 引入的 Cupertino 组件引用 CupertinoIcons 字形。
  cupertino_icons: ^1.0.8
  markdown: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_foreground_inset: 30
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#121212"
  image: assets/icon/splash_icon.png
  android: true
  ios: true
  web: false
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#FFFFFF"
    color_dark: "#121212"
    image: assets/icon/splash_icon.png

flutter:
  uses-material-design: true
  assets:
    # 与 Web 端阅读器共用同一组纸纹贴图。
    - assets/img/bg-paper.jpg
    - assets/img/bg-paper-dark.jpeg
